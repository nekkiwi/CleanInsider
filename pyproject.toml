[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"
# Skip vendored/data dirs (ruff already ignores .venv by default).
extend-exclude = ["data", "deploy", "results", ".venv"]

[tool.ruff.lint]
# Enable Pyflakes, pycodestyle, and isort rules.
select = ["E", "F", "W", "I"]
# Ignore E501 (line too long), which black handles.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # Ignore unused imports in __init__.py files
"tests/*" = ["E402"]        # Tests set sys.path before importing src
"scripts/*" = ["E402"]      # Scripts set sys.path before importing src

[tool.pytest.ini_options]
testpaths = ["tests"]
# Only collect proper test modules. This excludes the manual diagnostic
# scripts run by hand (quick_alpaca_test.py, debug_inference.py, run_tests.py).
python_files = ["test_*.py"]
norecursedirs = [".venv", "data", "deploy", "results", ".git"]
# test_e2e.py and test_logging.py execute on import (no __main__ guard) and
# require live models/credentials — they are manual scripts, not unit tests.
addopts = "--ignore=tests/test_e2e.py --ignore=tests/test_logging.py"
markers = [
    "slow: requires trained model/data artifacts on disk (deselected in CI via -m 'not slow')",
    "integration: hits live Alpaca/Google APIs and needs credentials (deselected in CI)",
]
